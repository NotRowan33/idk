<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="desktop">
        <div class="icon" id="calculatorIcon">
            <img src="https://cdn.iconscout.com/icon/free/png-256/free-calculator-icon-svg-png-download-100108.png" alt="Calculator Icon">
            <span>Calculator</span>
        </div>

        <div class="icon" id="notesIcon" style="top: 120px;">
            <img src="https://cdn.iconscout.com/icon/free/png-256/free-note-logo-icon-svg-png-download-100453.png" alt="Notes Icon">
            <span>Notes</span>
        </div>

        <div class="icon" id="tictactoeIcon" style="top: 220px;">
            <img src="https://cdn.iconscout.com/icon/free/png-256/free-tic-tac-toe-icon-svg-png-download-1652930.png" alt="Tic Tac Toe Icon">
            <span>Tic Tac Toe</span>
        </div>

        <div class="icon" id="settingsIcon" style="top: 320px;">
            <img src="https://cdn3.iconfinder.com/data/icons/linecons-free-vector-icons-pack/32/settings-256.png" alt="Settings Icon">
            <span>Settings</span>
        </div>

        <div class="icon" id="browserIcon" style="top: 420px;">
            <img src="https://cdn.iconscout.com/icon/free/png-256/free-browser-icon-svg-png-download-100107.png" alt="Browser Icon">
            <span>Browser</span>
        </div>

        <div class="app-window" id="browser-app" style="display: none;">
            <div class="header" id="browserHeader">
                <span class="title">Browser</span>
                <button class="close-button" id="closeBrowserButton">x</button>
            </div>
            <iframe src="https://www.google.com/webhp?igu=1" style="width:100%; height:100%; border:none;"></iframe>
            <div class="resize-handle"></div>
        </div>

        <div class="app-window" id="settings-app" style="display: none;">
            <div class="header" id="settingsHeader">
                <span class="title">Settings</span>
                <button class="close-button" id="closeSettingsButton">x</button>
            </div>
            <div id="wallpaper-options">
                <p>Choose a wallpaper:</p>
                <img src="https://images.unsplash.com/photo-1499678329028-101435549a4e?fm=jpg&q=60&w=3000&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8ZGVza3RvcCUyMHdhbGxwYXBlcnxlbnwwfHwwfHx8MA==" data-wallpaper>
                <img src="https://images.unsplash.com/photo-1507187632231-5beb21a654a2?fm=jpg&q=60&w=3000&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8M3x8ZGVza3RvcCUyMHdhbGxwYXBlcnxlbnwwfHwwfHx8MA==" data-wallpaper>
                <img src="https://images.unsplash.com/photo-1431440869543-efaf3388c585?fm=jpg&q=60&w=3000&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8NHx8ZGVza3RvcCUyMHdhbGxwYXBlcnxlbnwwfHwwfHx8MA==" data-wallpaper>
            </div>
            <div class="resize-handle"></div>
        </div>

        <div class="app-window" id="tictactoe-app" style="display: none;">
            <div class="header" id="tictactoeHeader">
                <span class="title">Tic Tac Toe</span>
                <button class="close-button" id="closeTictactoeButton">x</button>
            </div>
            <div id="tictactoe-board">
                <div class="cell" data-cell></div>
                <div class="cell" data-cell></div>
                <div class="cell" data-cell></div>
                <div class="cell" data-cell></div>
                <div class="cell" data-cell></div>
                <div class="cell" data-cell></div>
                <div class="cell" data-cell></div>
                <div class="cell" data-cell></div>
                <div class="cell" data-cell></div>
            </div>
            <div id="tictactoe-status"></div>
            <button id="tictactoe-restart">Restart</button>
            <div class="resize-handle"></div>
        </div>

        <div class="app-window" id="notes-app" style="display: none;">
            <div class="header" id="notesHeader">
                <span class="title">Notes</span>
                <button class="close-button" id="closeNotesButton">x</button>
            </div>
            <textarea id="notes-content"></textarea>
            <div class="resize-handle"></div>
        </div>

        <div class="app-window calculator" id="calculator" style="display: none;">
            <div class="header" id="calculatorHeader">
                <span class="title">Calculator</span>
                <button class="close-button" id="closeButton">x</button>
            </div>
            <div class="toggle-container">
                <label class="switch">
                    <input type="checkbox" id="darkModeToggle">
                    <span class="slider round"></span>
                </label>
            </div>
            <div class="display">
                <input type="text" id="result" disabled>
            </div>
            <div class="buttons">
                <button onclick="clearDisplay()">C</button>
                <button onclick="deleteLast()">DEL</button>
                <button onclick="appendCharacter('/')">/</button>
                <button onclick="appendCharacter('*')">*</button>
                <button onclick="appendCharacter('7')">7</button>
                <button onclick="appendCharacter('8')">8</button>
                <button onclick="appendCharacter('9')">9</button>
                <button onclick="appendCharacter('-')">-</button>
                <button onclick="appendCharacter('4')">4</button>
                <button onclick="appendCharacter('5')">5</button>
                <button onclick="appendCharacter('6')">6</button>
                <button onclick="appendCharacter('+')">+</button>
                <button onclick="appendCharacter('1')">1</button>
                <button onclick="appendCharacter('2')">2</button>
                <button onclick="appendCharacter('3')">3</button>
                <button onclick="calculateResult()">=</button>
                <button onclick="appendCharacter('0')">0</button>
                <button onclick="appendCharacter('.')">.</button>
            </div>
            <div class="resize-handle"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
